<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beszélj!">
<meta name="theme-color" content="#13203B">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="beszelj-app" content="BESZELJ_APP">
<title>Beszélj! – napi 10 perc angol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --ink:#13203B; --muted:#5A6680; --soft:#DCE3EE;
  --red:#E23D4B; --sun:#FFC83A; --mint:#16967F; --blue:#2F5BEA;
  --ok-bg:#DDF4EE; --bad-bg:#FBE1E3;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1525; --surface:#172139; --ink:#EAF0FA; --muted:#9AA7C2; --soft:#26324F;
    --ok-bg:#123A35; --bad-bg:#45202A; --blue:#7C9BFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#172139; --ink:#EAF0FA; --muted:#9AA7C2; --soft:#26324F;
  --ok-bg:#123A35; --bad-bg:#45202A; --blue:#7C9BFF;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:16px 18px 40px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:.4em 0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:14px 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:1.05rem;min-height:52px}
.btn.big{width:100%;font-size:1.15rem;min-height:60px}
.btn.sun{background:var(--sun);color:#13203B}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--blue);font-weight:700;text-decoration:underline;padding:6px 2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:1.2rem}
.panel{background:var(--surface);border-radius:22px;padding:20px;margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:2px solid var(--soft);background:var(--surface);font-weight:700;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--soft);border-radius:16px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}

/* metro line */
.metro{position:relative;padding:28px 6px 6px}
.metro .track{position:absolute;left:18px;right:18px;top:40px;height:8px;border-radius:8px;background:var(--soft)}
.metro .fill{position:absolute;left:18px;top:40px;height:8px;border-radius:8px;background:var(--red)}
.metro .stations{position:relative;display:flex;justify-content:space-between}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;width:24px}
.st .dot{width:24px;height:24px;border-radius:50%;background:var(--surface);border:5px solid var(--soft)}
.st.done .dot{border-color:var(--red)}
.st.here .dot{border-color:var(--red);background:var(--sun);transform:scale(1.35)}
.st .lbl{font-family:var(--display);font-weight:800;font-size:.95rem}
.st.here .lbl{color:var(--red)}
.pin{position:absolute;top:0;transform:translateX(-50%);font-size:.8rem;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 9px;border-radius:999px;white-space:nowrap}

.hello{margin:6px 0 4px}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--surface);border-radius:18px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.today{background:var(--ink);color:var(--bg);border-radius:26px;padding:22px;margin:16px 0;position:relative;overflow:hidden}
.today::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:14px solid var(--red);opacity:.9}
.today h2{font-size:1.9rem;position:relative;z-index:1}
.today p{position:relative;z-index:1;opacity:.85}
.today .btn{position:relative;z-index:1;margin-top:14px}
.steps{display:flex;gap:6px;margin:12px 0 0;position:relative;z-index:1;flex-wrap:wrap}
.steps span{font-size:.82rem;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.rowlist{display:grid;gap:10px}
.rowbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:14px 16px;min-height:64px}
.rowbtn .em{font-size:1.7rem;width:40px;text-align:center}
.rowbtn b{display:block;font-family:var(--display);font-size:1.08rem}
.rowbtn small{color:var(--muted);font-size:.88rem}

/* session */
.sesshead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:8px;border-radius:8px;background:var(--soft)}
.prog i.on{background:var(--red)}
.prog i.cur{background:var(--sun)}
.clock{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.95rem}
.clock.done{background:var(--mint);color:#fff}
.stepname{font-size:.95rem;color:var(--muted);margin:4px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:3px solid transparent;border-radius:16px;padding:14px 10px;min-height:62px;font-weight:700;text-align:center;transition:transform .12s, opacity .25s}
.tile.sel{border-color:var(--blue)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.9)}
.tile.ok{background:var(--ok-bg);border-color:var(--mint)}
.tile.bad{background:var(--bad-bg);border-color:var(--red)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--surface);border:3px solid transparent;border-radius:16px;padding:14px 16px;min-height:56px;font-weight:700}
.opt.ok{background:var(--ok-bg);border-color:var(--mint)}
.opt.bad{background:var(--bad-bg);border-color:var(--red)}
.play{display:flex;gap:10px;align-items:center;margin:18px 0 6px}
.playbig{width:84px;height:84px;border-radius:50%;background:var(--sun);color:#13203B;font-size:2rem;display:grid;place-items:center}
.reveal{background:var(--surface);border-radius:14px;padding:10px 14px;margin-top:12px;font-weight:700}
.answer{min-height:64px;background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;border:2px dashed var(--soft);margin-top:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.word{padding:10px 14px;border-radius:12px;background:var(--surface);font-weight:700;border-bottom:3px solid var(--soft)}
.answer .word{background:var(--soft)}
.feedback{margin-top:14px;padding:12px 16px;border-radius:16px;font-weight:700}
.feedback.ok{background:var(--ok-bg)}
.feedback.bad{background:var(--bad-bg)}
.foot{margin-top:20px}
.mic{width:96px;height:96px;border-radius:50%;background:var(--red);color:#fff;font-size:2.4rem;display:grid;place-items:center;margin:16px auto 6px;box-shadow:0 0 0 0 rgba(226,61,75,.5)}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(226,61,75,0)}100%{box-shadow:0 0 0 0 rgba(226,61,75,0)}}
.heard{text-align:center;min-height:1.5em;font-weight:700;margin-top:6px}
.center{text-align:center}

/* roleplay */
.rp{display:flex;flex-direction:column;min-height:calc(100vh - 60px)}
.mission{background:var(--surface);border-radius:18px;padding:12px 14px;font-size:.93rem}
.mission ul{list-style:none;padding:0;margin:6px 0 0}
.mission li{padding:2px 0}
.mission li.done{color:var(--mint);font-weight:700}
.chat{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 0}
.bub{max-width:86%;padding:12px 14px;border-radius:18px;position:relative}
.bub.them{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:6px}
.bub .hu{margin-top:6px;font-size:.9rem;color:var(--muted);border-top:1px solid var(--soft);padding-top:6px}
.bubtools{display:flex;gap:6px;margin-top:6px}
.mini{font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft)}
.fix{align-self:flex-end;max-width:86%;background:var(--ok-bg);border-radius:14px;padding:8px 12px;font-size:.9rem}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;padding:4px 8px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sugg button{font-size:.88rem;padding:8px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--soft);text-align:left}
.inputbar{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.inputbar input{flex:1;min-height:52px}
.roundbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;flex:none}
.roundbtn.mic2{background:var(--red);color:#fff}
.roundbtn.mic2.live{animation:pulse 1.2s infinite}
.roundbtn.send{background:var(--ink);color:var(--bg)}
.banner{background:var(--sun);color:#13203B;border-radius:16px;padding:12px 16px;font-weight:700;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;max-width:90vw;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.loader{text-align:center;padding:80px 10px}
.loader .train{font-size:3rem;display:inline-block;animation:ride 1.6s ease-in-out infinite}
@keyframes ride{0%{transform:translateX(-60px)}50%{transform:translateX(60px)}100%{transform:translateX(-60px)}}
.wordrow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.wordrow div{flex:1}
.wordrow small{color:var(--muted);display:block}
.big-level{font-family:var(--display);font-size:5rem;font-weight:800;color:var(--red);line-height:1}
.qcount{font-family:var(--display);font-weight:800;color:var(--red)}
.qtext{font-size:1.35rem;font-weight:700;margin:10px 0 4px;font-family:var(--display)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.rowbtn.locked{opacity:.65}
.rowbtn.buddy{border:2px solid var(--sun)}
.examcard{border:3px solid var(--red)}
.surprise{align-self:flex-start;background:var(--sun);color:#13203B;font-weight:800;font-size:.85rem;padding:4px 12px;border-radius:999px}
.emoji-scene{font-size:3.4rem;text-align:center;letter-spacing:.15em;margin:16px 0 4px;line-height:1.3}
.stars{font-size:1.6rem;color:var(--sun);letter-spacing:.1em}
.boxes{color:var(--red);font-size:.75rem;letter-spacing:1px;white-space:nowrap}
.facts{margin:8px 0;padding-left:20px}
.facts li{margin:3px 0}
.word.okw{background:var(--ok-bg);border-color:var(--mint)}
.word.badw{background:var(--bad-bg);border-color:var(--red)}
.etokens .word{font-size:1.1rem}
.exhu{font-size:.9rem}
.recallword{font-family:var(--display);font-size:2.2rem;font-weight:800;text-align:center;margin:18px 0 6px}
.hintline{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;letter-spacing:.12em;color:var(--red);margin-bottom:6px}
.revbanner{display:inline-block;background:var(--sun);color:#13203B;font-family:var(--display);font-weight:800;font-size:1.3rem;padding:8px 16px;border-radius:14px;margin:4px 0 6px}
.huw{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.huw p{margin:4px 0}
.gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--red);text-align:center;color:var(--red);margin:0 4px}
.dlg{display:grid;gap:8px;margin-top:12px}
.dline{text-align:left;background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;border:2px solid var(--soft)}
.dline.placed{border-color:var(--blue)}
.dline .who{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);text-align:center;font-size:.8rem;line-height:24px;margin-right:8px}
.pool2{margin-top:18px;padding-top:12px;border-top:2px dashed var(--soft)}
.note{padding:10px 0;border-top:1px solid var(--soft)}
.note:first-of-type{border-top:0}
.ntag{display:inline-block;font-size:.78rem;font-weight:700;background:var(--soft);padding:2px 10px;border-radius:999px;margin-bottom:4px}
.pattern{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--soft);font-family:var(--display);font-weight:700}
.gcard summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.gcard summary::-webkit-details-marker{display:none}
/*topics-css*/
.tcat summary,.ttopic summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
.tcat summary::-webkit-details-marker,.ttopic summary::-webkit-details-marker{display:none}
.tcat>summary{font-family:var(--display);font-size:1.1rem}
.tcat>summary::before,.ttopic>summary::before{content:"▸";color:var(--red);display:inline-block;transition:transform .15s}
.tcat[open]>summary::before,.ttopic[open]>summary::before{transform:rotate(90deg)}
.tcount{margin-left:auto;font-size:.85rem;font-variant-numeric:tabular-nums}
.ttopic{display:block;border-top:1px solid var(--soft);padding:10px 0 4px;margin-top:8px}
.ttopic>summary span:first-of-type{font-weight:700}
.tbar{flex:0 0 60px;height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin-left:auto}
.tbar i{display:block;height:100%;background:var(--mint)}
.ttopic .tcount{margin-left:6px}
.tlist{display:flex;flex-direction:column;padding:6px 0 4px 4px;width:100%}
.tlisthead{display:grid;grid-template-columns:40px 1fr 44px;gap:10px;font-size:.78rem;color:var(--muted);font-weight:700;padding:2px 0 4px}
.tlisthead span:last-child{text-align:center}
.trow{display:grid;grid-template-columns:40px 1fr 44px;align-items:center;gap:10px;width:100%;padding:9px 0;border-bottom:1px dashed var(--soft);transition:opacity .3s,transform .3s}
.trow .ttext{display:block;min-width:0;line-height:1.35;cursor:default;user-select:none;-webkit-user-select:none}
.tdash{color:var(--muted);white-space:pre}
.tbox{display:flex;align-items:center;justify-content:center}
.trow input{width:26px;height:26px;accent-color:var(--mint);justify-self:center;margin:0}
.trow.tdone{opacity:0;transform:translateX(30px)}
.undobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;z-index:30;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.undobar[hidden]{display:none}
.undobar .btn{min-height:40px;padding:8px 14px;font-size:.92rem}
/*whatsnew-css*/
.whatsnew{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.wncard{background:var(--surface);color:var(--ink);border-radius:24px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.wncard ul{padding-left:20px;margin:12px 0 18px}.wncard li{margin:6px 0}
/*practice-css*/
.aitag{font-size:.7rem;background:var(--blue);color:#fff;padding:1px 7px;border-radius:999px;vertical-align:middle;font-family:var(--body)}
.rowbtn.practice{border:2px solid var(--mint)}
.sprintbar{display:flex;justify-content:space-between;background:var(--surface);border-radius:14px;padding:10px 14px;margin:6px 0 10px;font-size:1rem}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.memcard{min-height:84px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:800;font-size:1rem;padding:8px;font-family:var(--display);transition:transform .2s}
.memcard.up{background:var(--surface);color:var(--ink);border:3px solid var(--blue);font-family:var(--body);font-size:.92rem}
.memcard.up.hu{border-color:var(--sun)}
.memcard.matched{background:var(--ok-bg);border-color:var(--mint);opacity:.85}
.storytext{line-height:2.1;font-size:1.05rem}
.sgap{display:inline-block;min-width:54px;padding:2px 10px;margin:0 2px;border-radius:10px;border:2px dashed var(--red);color:var(--red);font-weight:800;line-height:1.5}
.sgap.filled{border-style:solid;border-color:var(--blue);color:var(--ink);background:var(--soft)}
.sgap.okw{background:var(--ok-bg);border-color:var(--mint)}
.sgap.badw{background:var(--bad-bg);border-color:var(--red)}
</style>
</head>

function nextGrammar(){
  const lv=S.level??1, done=S.grammar||[];
  const weak=done.filter(g=>g.score<3&&g.date<addDays(-3)).sort((a,b)=>a.date<b.date?-1:1)[0];
  if(weak&&Math.random()<0.4) return {topic:weak.topic,review:true};
  const t=GRAMMAR[lv].find(t=>!done.some(g=>g.topic===t));
  if(t) return {topic:t,review:false};
  const old=done.filter(g=>GRAMMAR[lv].includes(g.topic)).sort((a,b)=>a.date<b.date?-1:1)[0];
  return {topic:old?old.topic:GRAMMAR[lv][0],review:true};
}

/* ---------- AI ---------- */
async function httpPost(url,headers,body){
  if(NATIVE) return nativePost(url,headers,body);
  try{const r=await fetch(url,{method:"POST",headers,body});return {status:r.status,body:await r.text()};}catch(e){return {status:0,body:""};}
}
async function ask(prompt,opts={}){
  if(sample) return sample.json(prompt,opts);
  if(!API_KEY) throw {code:"unavailable"};
  const headers={"content-type":"application/json","authorization":"Bearer "+API_KEY};
  const msgs=[{role:"system",content:"You are a helpful assistant inside an English-learning app. Always answer with a single valid JSON object only."},{role:"user",content:prompt}];
  let r=await httpPost("https://api.openai.com/v1/chat/completions",headers,JSON.stringify({model:"gpt-4.1-mini",messages:msgs,response_format:{type:"json_object"},max_tokens:2500,temperature:0.85}));
  if(r.status===404||(r.status===400&&/model/i.test(r.body))){
    r=await httpPost("https://api.openai.com/v1/chat/completions",headers,JSON.stringify({model:"gpt-5-mini",messages:msgs,response_format:{type:"json_object"},max_completion_tokens:5000,reasoning_effort:"minimal"}));
  }
  if(r.status===0) throw {code:"network"};
  if(r.status===401||r.status===403) throw {code:"bad_key"};
  if(r.status===429) throw {code:/insufficient_quota/.test(r.body)?"no_credit":"rate_limited"};
  if(r.status>=400) throw {code:"api_error"};
  const d=JSON.parse(r.body);
  const t=String((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"").replace(/```json|```/g,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<a) throw {code:"bad_json"};
  return JSON.parse(t.slice(a,b+1));
}
function aiErr(e){
  const c=e&&e.code;
  return c==="bad_key"?"Érvénytelen API-kulcs. Ellenőrizd a ⚙️ Beállításokban.":c==="no_credit"?"Elfogyott az OpenAI egyenleged. Tölts fel a platform.openai.com oldalon.":c==="rate_limited"?"Kicsit sok volt egyszerre, várj pár másodpercet.":c==="network"?"Nincs internetkapcsolat, vagy nem érhető el a szerver.":c==="unavailable"?"Add meg a ChatGPT-kulcsot a ⚙️ Beállításokban.":"Nem jött válasz. Próbáld újra.";
}

function speak(text,rate){
  if(NATIVE){try{AndroidBridge.speak(String(text),rate||S.settings.rate,S.settings.accent);}catch(e){}return;}
  if(!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=S.settings.accent;const v=voices.find(v=>v.lang===S.settings.accent)||voices.find(v=>v.lang&&v.lang.startsWith("en"));if(v)u.voice=v;u.rate=rate||S.settings.rate;speechSynthesis.speak(u);}catch(e){}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srBroken=!SR&&!NATIVE, activeRec=null;
function listen(onText,onDone){
  if(srBroken){onDone("unsupported","");return;}
  let finished=false,last="";
  const end=err=>{if(finished)return;finished=true;activeRec=null;onDone(err,last);};
  if(NATIVE){
    activeRec={native:true};
    let committed="";
    window.__srEvent=function(type,t){
      if(type==="partial"){last=(committed+" "+t).trim();onText(last);}
      else if(type==="segment"){if(t)committed=(committed+" "+t).trim();last=committed;onText(last);}
      else if(type==="final"){if(t){committed=(committed+" "+t).trim();last=committed;onText(last);}end(null);}
      else if(type==="end"){last=committed||last;end(null);}
      else if(type==="error"){if(t==="not-allowed"||t==="unsupported")srBroken=true;end(t==="no-speech"&&last?null:t);}
    };
    try{AndroidBridge.startListening(S.settings.accent);}catch(e){end("start");}
    return;
  }
  try{
    const r=new SR();r.lang=S.settings.accent;r.interimResults=true;r.maxAlternatives=1;r.continuous=true;
    r.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;last=t;onText(t);};
    r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture")srBroken=true;end(e.error);};
    r.onend=()=>end(null);r.start();activeRec=r;
  }catch(e){srBroken=true;end("start");}
}
function stopListen(){try{if(activeRec&&activeRec.native)AndroidBridge.stopListening();else if(activeRec)activeRec.stop();}catch(e){}}
const MIC_FALLBACK="A mikrofon nem érhető el (engedély vagy beszédfelismerő hiányzik). Tipp: koppints a szövegmezőbe, és használd a billentyűzet 🎤 diktálás gombját.";
function wireMic(btn,field,info,onStart){
  btn.addEventListener("click",()=>{
    if(activeRec){stopListen();return;}
    if(srBroken){if(info)info.textContent=MIC_FALLBACK;else toast(MIC_FALLBACK,5000);field.focus();return;}
    if(onStart)onStart();
    const base=field.value?field.value.trim()+" ":"";
    btn.classList.add("live");if(info)info.textContent="Hallgatlak… nyugodtan tarts szünetet. Ha befejezted, koppints a 🎤-re.";
    listen(t=>{field.value=base+t;field.dispatchEvent(new Event("input"));},err=>{btn.classList.remove("live");if(info)info.textContent=err&&err!=="no-speech"&&err!=="aborted"&&srBroken?MIC_FALLBACK:"Koppints a mikrofonra és beszélj";});
  });
}

let T=null;
function startTest(){T={ability:1.5,used:new Set(),n:0,total:10,item:null,answered:false,correct:0};nextItem();go("test");}
function nextItem(){
  const target=Math.max(0,Math.min(4,Math.round(T.ability)));
  let pool=TEST.map((t,i)=>({t,i})).filter(x=>!T.used.has(x.i)&&x.t.l===target);
  if(!pool.length)pool=TEST.map((t,i)=>({t,i})).filter(x=>!T.used.has(x.i)).sort((a,b)=>Math.abs(a.t.l-target)-Math.abs(b.t.l-target)).slice(0,3);
  const pick=pool[Math.floor(Math.random()*pool.length)];T.used.add(pick.i);
  T.item={...pick.t,opts:shuffle(pick.t.o),correct:pick.t.o[0]};T.answered=false;
}
function quizBody(it,label,n,total,act){
  return `<div class="sesshead"><div class="prog">${Array.from({length:total},(_,i)=>`<i class="${i<n?"on":i===n?"cur":""}"></i>`).join("")}</div></div>
  <p class="stepname">${label} · <span class="qcount">${n+1}/${total}</span></p>
  ${it.listen?`<div class="play"><button class="playbig" data-act="say" data-t="${esc(it.listen)}" aria-label="Lejátszás">🔊</button><button class="btn ghost" data-act="say-slow" data-t="${esc(it.listen)}">🐢 Lassan</button></div>`:""}
  <div class="qtext">${esc(it.q)}</div>
  <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-act="${act}" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
}

function markOpts(btn,ok,correct){btn.classList.add(ok?"ok":"bad");if(!ok)document.querySelectorAll(".opt").forEach(b=>{if(b.textContent===correct)b.classList.add("ok");});}
function testAnswer(i,btn){
  if(T.answered)return;T.answered=true;
  const it=T.item,ok=it.opts[i]===it.correct;markOpts(btn,ok,it.correct);
  if(ok)T.correct++;T.ability+=ok?0.6:-0.6;T.ability=Math.max(-0.4,Math.min(4.4,T.ability));T.n++;

}

function choosePair(){
  const pick=(arr,recent)=>{const c=arr.filter(a=>!recent.includes(a));const p=c.length?c:arr;return p[Math.floor(Math.random()*p.length)];};

function prepLesson(L,GT){
  if(L.grammar&&!L.grammar.topic)L.grammar.topic=GT.topic;

  L.listening.forEach(x=>{x.correct=x.hu_options[0];x.opts=shuffle(x.hu_options.slice(0,4));});

  if(g&&g.explain_hu&&Array.isArray(g.practice)){

    g.examples=Array.isArray(g.examples)?g.examples.filter(x=>x&&x.en).slice(0,3):[];
    if(g.practice.length>=2){g.practice.forEach(x=>{x.correct=x.options[0];x.opts=shuffle(x.options.slice(0,4));});}else L.grammar=null;
  }else L.grammar=null;

function wkey(w){return norm(w).replace(/^(to|a|an|the) /,"");}
function hkey(h){return String(h||"").toLowerCase().replace(/\([^)]*\)/g,"").replace(/[^a-záéíóöőúüű ]/g," ").replace(/\s+/g," ").trim();}
function onlyNewWords(L){

  if(fresh.length<6){
    const pool=[];TOPICS.forEach(c=>c.items.forEach(t=>t.words.forEach(w=>{const k=wkey(w.en);if(!known.has(k)&&!seen.has(k)&&!knownHu.has(hkey(w.hu)))pool.push(w);})));
    const lv=S.level??1;
    shuffle(pool).slice(0,6-fresh.length).forEach(w=>{seen.add(wkey(w.en));fresh.push({en:w.en,hu:w.hu,example:"",example_hu:""});});

}

function matchTap(btn){

function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i].concat(new Array(n).fill(0)));for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function recallMatch(got,want){
  const g=norm(got).replace(/^(to|a|an|the) /,""),w=norm(want).replace(/^(to|a|an|the) /,"");
  if(!g)return 0;if(g===w)return 2;
  if(w.length>=5&&lev(g,w)<=1)return 1;
  return 0;
}

     ${r.better?`<p style="margin-top:10px"><b>Így még jobb:</b> ${esc(r.better)} <button class="mini" data-act="say" data-t="${esc(r.better)}">🔊</button></p>`:""}

function buddyPrompt(latest){
  const lv=S.level??1;
  const facts=S.buddyFacts.length?S.buddyFacts.map(f=>"- "+f).join("\n"):"nothing yet. Get to know them over time: name, where they live, job, hobbies, family, plans.";
  const log=S.buddyLog.length?S.buddyLog.join("\n"):"(this is your first chat)";
  const today=RP.turns.map(t=>(t.role==="me"?"Learner: ":"You: ")+t.text).join("\n");
  return `You are ${BUDDY.character}. You are the learner's English-speaking friend inside a language-learning app. Chat like a real friend: casual, warm, curious; share small things from your own life too; ask one question at a time.
Learner: ${S.name||"the learner"}, a Hungarian, level ${LEVELS[lv]}. ${LEVEL_GUIDE[lv]}

${facts}

function knownSet(){return new Set(S.words.map(w=>w.en.toLowerCase()));}
function topicAll(t){const extra=(S.topicExtra&&S.topicExtra[t.id])||[];const seen=new Set();return t.words.concat(extra).filter(w=>{const k=w.en.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});}

function pickPractice(n){

}

function pSprint(){

function sprintQ(){
  const all=learned(),w=all[Math.floor(Math.random()*all.length)],dir=Math.random()<0.5;
  const others=shuffle(all.filter(x=>x.en!==w.en&&x.hu!==w.hu)).slice(0,3);
  const correct=dir?w.hu:w.en,opts=shuffle([correct].concat(others.map(o=>dir?o.hu:o.en)));
  P.q={w,dir,correct,opts};P.lock=false;
  app.innerHTML=pHead("⏱️ Villám-sprint")+`<div class="sprintbar"><span>Pont: <b>${P.score}</b></span><span>${P.combo>=3?`🔥 x${1+Math.floor(P.combo/3)}`:`Sorozat: ${P.combo}`}</span></div>
  <p class="muted center">${dir?"Mit jelent?":"Hogy mondod angolul?"}</p><div class="recallword">${esc(dir?w.en:w.hu)}</div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-act="sp-ans" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  if(dir)speak(w.en,1);

function sprintAnswer(i,btn){
  if(P.lock)return;P.lock=true;const q=P.q,ok=q.opts[i]===q.correct;P.n++;markOpts(btn,ok,q.correct);
  if(ok){P.combo++;P.score+=1+Math.floor((P.combo-1)/3);}else{P.combo=0;P.wrong.push(q.w);markWord(q.w.en,false);}
  setTimeout(()=>{if(Date.now()<P.end)sprintQ();else sprintEnd();},ok?250:900);
}

}

function pGrammarRender(){

function backupCopy(){
  const data="BESZELJ-MENTES:"+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,state:S,key:API_KEY}))));
  const out=document.getElementById("bkout");
  const done=()=>toast("📋 Mentés kimásolva! Illeszd be egy jegyzetbe.",3500);
  const manual=()=>{if(out){out.hidden=false;out.value=data;out.focus();out.select();try{document.execCommand("copy")?done():toast("Jelöld ki és másold ki a szöveget.",3500);}catch(e){toast("Jelöld ki és másold ki a szöveget.",3500);}}};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(data).then(()=>{done();if(out){out.hidden=false;out.value=data;}},manual);else manual();}catch(e){manual();}
}
function backupRestore(){
  const t=(document.getElementById("bkin")||{}).value||"";
  try{
    const m=t.trim().replace(/^BESZELJ-MENTES:/,"");const o=JSON.parse(decodeURIComponent(escape(atob(m))));
    if(!o||!o.state||!Array.isArray(o.state.words))throw 0;
    if(!tapTwice("bkr","Koppints újra: a jelenlegi haladás felülíródik a mentéssel."))return;
    S=Object.assign(defaultState(),o.state);if(o.key)API_KEY=o.key;try{localStorage.setItem(KEYLS,API_KEY);}catch(e){}save();toast("✅ Visszaállítva!");go("home");
  }catch(e){toast("Ez nem érvényes mentés.",3000);}
}
/* ---------- remote update ---------- */
const RU_URL="beszelj-remote-url",RU_LAST="beszelj-remote-last";
function ruGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function ruSet(k,v){try{v==null||v===""?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
function ruNormalize(u){u=String(u||"").trim();const m=/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/.exec(u);return m?`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`:u;}
function ruPending(){const v=ruGet("beszelj-remote-ver");return v&&v!==ruGet("beszelj-remote-bad")&&__BOOT.cmp(v,APP_VERSION)>0?v:"";}
async function ruCheck(manual){
  const url=ruGet(RU_URL);if(!url){if(manual)toast("Előbb add meg a frissítési címet.");return;}
  if(manual)toast("Frissítés keresése…",2000);
  try{
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)throw new Error("http "+r.status);
    const h=await r.text();ruSet(RU_LAST,new Date().toISOString());
    if(h.indexOf("BESZELJ_APP")<0){if(manual)toast("A címen nem Beszélj! fájl van. Ellenőrizd a linket.",4000);return;}
    const v=__BOOT.verOf(h);
    if(!v){if(manual)toast("A letöltött fájl túl régi az automatikus frissítéshez.",4000);return;}
    if(__BOOT.cmp(v,APP_VERSION)>0&&v!==ruGet("beszelj-remote-bad")){
      ruSet("beszelj-remote-html",h);ruSet("beszelj-remote-ver",v);
      toast(`✨ Új verzió letöltve (v${v})! A ⚙️ Beállításokban azonnal betöltheted, vagy a következő indításkor magától elindul.`,6000);
      if(view==="settings")vSettings();
    }else if(manual)toast(`Ez a legfrissebb verzió (v${APP_VERSION}). ✅`,3000);
  }catch(e){if(manual)toast("Nem sikerült elérni a frissítési címet. Van internet, és jó a link?",4500);}
}
function ruRestart(){
  const h=ruGet("beszelj-remote-html"),v=ruPending();if(!h||!v){toast("Nincs letöltött új verzió.");return;}
  if(SS&&!SS.review)saveSession();save();clearInterval(clockTimer);clearInterval(pTimer);stopListen();
  ruSet("beszelj-remote-try",v);if(window.__BESZELJ_SWITCHED)return;window.__BESZELJ_SWITCHED=1;
  const OWNH="<!doctype html>"+document.documentElement.outerHTML.replace(/<div id="app">[\s\S]*?<\/div>\s*<script>/,'<div id="app"></div>\n<script>');window.__BESZELJ_REMOTE=1;
  document.open();document.write(h);document.close();
  setTimeout(function(){try{if(localStorage.getItem("beszelj-remote-ok")!==v){localStorage.setItem("beszelj-remote-bad",v);localStorage.removeItem("beszelj-remote-try");window.__BESZELJ_REMOTE=1;document.open();document.write(OWNH);document.close();}}catch(e){}},5000);
}
function ruAuto(){const url=ruGet(RU_URL);if(!url)return;const last=Date.parse(ruGet(RU_LAST)||0)||0;if(Date.now()-last>3*3600*1000)setTimeout(()=>ruCheck(false),2500);}

    case "hint":{const h=document.getElementById("hint");if(h)h.hidden=false;break;}
    case "evalspeak":evalSpeak();break;
    case "scenario":{const sc=SCENARIOS.find(x=>x.id===b.dataset.id);if(!isUnlocked(sc)){toast(`🔒 Ez a jelenet ${sc.unlock} napos sorozatnál nyílik meg. Most: ${S.streak} nap.`);break;}if(!ai()){toast("A szerepjátékhoz add meg a ChatGPT-kulcsot a ⚙️ Beállításokban.");break;}startRoleplay(sc,false);break;}
    case "buddy":startBuddy();break;
    case "hu":{const t=RP.turns[+b.dataset.i];t.showHu=!t.showHu;vRoleplay();break;}
    case "sugg":{const inp=document.getElementById("rin");if(inp){inp.value=RP.sugg[+b.dataset.i];inp.focus();toast("Mondd ki hangosan is, mielőtt elküldöd! 🗣️");}break;}
    case "rsend":rpSend();break;
    case "rpend":rpEnd();break;
    case "rpexit":go(RP&&RP.words?"practice":"home");break;
    case "exam":startExam();break;
    case "xans":examAnswer(+b.dataset.i,b);break;
    case "review":startReview();break;
    case "savekey":{const v=document.getElementById("key").value.trim();setKey(v);vSettings();toast(v?"Kulcs elmentve ✅":"Kulcs törölve");break;}
    case "delkey":setKey("");vSettings();toast("Kulcs törölve");break;
    case "pickupdate":try{AndroidBridge.pickUpdate();}catch(err){toast("A frissítés betöltése nem sikerült.");}break;
    case "resetupdate":if(tapTwice("rup","Koppints újra a visszaálláshoz.")){try{AndroidBridge.resetUpdate();}catch(err){}}break;
    case "forget":if(tapTwice("forget","Koppints újra: Emma mindent elfelejt rólad.")){S.buddyFacts=[];S.buddyLog=[];save();vSettings();}break;
    case "accent":S.settings.accent=b.dataset.v;save();vSettings();speak("Hello! How are you today?");break;
    case "rate":S.settings.rate=+b.dataset.v;save();vSettings();break;
    case "sinterest":{const v=b.dataset.v;S.interests=S.interests.includes(v)?S.interests.filter(x=>x!==v):[...S.interests,v];save();b.setAttribute("aria-pressed",S.interests.includes(v));break;}
    case "setlevel":S.level=+b.dataset.v;save();vSettings();break;
    case "retest":ob={name:S.name,interests:S.interests.slice()};startTest();break;
    case "reset":if(tapTwice("reset","Koppints újra: minden haladás és szó törlődik.")){S=defaultState();save();go("welcome");}break;
  }
});
render();
initCaps();
if(NATIVE&&AndroidBridge.ready){try{AndroidBridge.ready();}catch(e){}}
ruSet("beszelj-remote-ok",APP_VERSION);
/* what's new */
const CHANGELOG={
 "2.15":["Frissítés után az app megmutatja, mi változott (ezt látod most 🙂)","Az első távoli frissítés sikeresen megérkezett a GitHubról 🎉"],
 "2.16":["Az app mostantól iPhone-on is használható: Safariból a kezdőképernyőre tehető, saját ikonnal","A haladásod a 💾 Biztonsági mentéssel átvihető egyik telefonról a másikra"]
};
(function(){const prev=ruGet("beszelj-seen-ver")||(S.level!==null&&S.updatedAt?"2.14":"");ruSet("beszelj-seen-ver",APP_VERSION);
  if(!prev||prev===APP_VERSION||S.level===null)return;
  const items=Object.keys(CHANGELOG).filter(v=>__BOOT.cmp(v,prev)>0&&__BOOT.cmp(v,APP_VERSION)<=0).sort((a,b)=>__BOOT.cmp(a,b)).flatMap(v=>CHANGELOG[v]);
  const box=document.createElement("div");box.className="whatsnew";box.setAttribute("role","dialog");
  box.innerHTML=`<div class="wncard"><h3>✨ Frissítve: v${esc(APP_VERSION)}</h3>${items.length?`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:"<p>Kisebb javítások.</p>"}<button class="btn big sun" id="wnok">Szuper!</button></div>`;
  document.body.appendChild(box);document.getElementById("wnok").addEventListener("click",()=>box.remove());
})();
ruAuto();
window.__dbg=function(c){return eval(c);};
}
if(!window.__SKIP_MAIN)__main();
